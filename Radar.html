<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM YOLO - 战力雷达图</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap");
:root{
--theme-color:#87CEEB;         /* 主题色（由 JS 动态设置） */
--desc-color:rgba(255,255,255,0.9); /* 简介文字颜色（由 JS 动态设置） */
--name-delay:0ms;--photo-delay:0ms;--desc-delay:0ms;--box-delay:0ms;   /* 各 UI 元素出现延迟（由 JS 设置） */
--name-dur:0.85s;--photo-dur:0.85s;--desc-dur:0.85s;--box-dur:0.85s;  /* 各 UI 元素动画时长（由 JS 设置） */
}
/* ★ 禁止页面一切元素被选中 / 拖拽 */
*{
margin:0;padding:0;box-sizing:border-box;
-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
-webkit-user-drag:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
}
img{
-webkit-user-drag:none;
user-drag:none;
pointer-events:none;
}
body{font-family:"Noto Sans SC","HarmonyOS Sans SC","PingFang SC","Lantinghei SC","Microsoft YaHei","HanHei SC","Helvetica Neue","Open Sans",Arial,sans-serif;overflow:hidden;background-color:#000;color:#fff;cursor:default;}
#particles-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1005;pointer-events:none;}
body.particles-disabled #particles-canvas{display:none;}
@keyframes gradientBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.bg-layer{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;opacity:0;transition:opacity 3s ease-in-out;will-change:opacity;pointer-events:none;background-size:400% 400%;animation:gradientBG 30s ease infinite;}
.bg-layer.active{opacity:1;}
.container{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;height:100vh;padding:1vh 1vw;}
.main-layout{display:flex;width:98%;max-width:1700px;height:94vh;position:relative;}
.left-panel{flex:1.3;display:flex;justify-content:center;align-items:center;position:relative;overflow:visible;}
#radarCanvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;width:1600px;height:1600px;}
.radar-glass{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);backdrop-filter:blur(4px) saturate(120%);-webkit-backdrop-filter:blur(4px) saturate(120%);background:rgba(255,255,255,0.01);pointer-events:none;z-index:1;opacity:0;width:1600px;height:1600px;clip-path:polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%);transition:opacity 0.3s ease;}
.right-panel{flex:0.7;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 10px;margin-left:0;}

/* ============================================================
   信息框：外层容器（含固定尺寸 + 视觉层容器）
   ============================================================ */
.band-info-box{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;                     /* 【大框内间距】名字/照片/简介之间的垂直距离 */
  width:min(100%,545px);        /* 【大框宽度】560 → 545，略微缩小 */
  height:64vh;                   /* 【大框高度】66 → 64，略微缩小 */
  min-height:450px;
  max-height:700px;
  padding:33px 28px;            /* 【大框内距】上/下 33px，左/右 28px */
  box-sizing:border-box;
  z-index:1;                    /* 图层：在背景色 / 粒子之上，其余元素之下 */
}
/* 大框视觉层：边框 + 毛玻璃 + 泛光 + 缩放动画（独立 DOM 元素，和名字/照片/描述同一套机制） */
.band-info-box__visual{
  position:absolute;
  inset:0;
  border:1.5px solid var(--theme-color);   /* 【大框边框】颜色跟随主题色，粗细 1.5px */
  border-radius:24px;                       /* 【大框圆角】数字越大越圆 */
  background:rgba(255,255,255,0.025);       /* 【大框背景亮度】0.030，数字越大框内越亮 */
  backdrop-filter:blur(7px) saturate(110%); /* 【大框模糊】5px，数字越大越模糊 */
  -webkit-backdrop-filter:blur(5px) saturate(110%);
  box-shadow:
    0 0 18px -6px var(--theme-color),          /* 【大框泛光】外发光，比雷达最外圈弱 */
    inset 0 0 20px -12px var(--theme-color);   /* 【大框内发光】内侧泛光 */
  opacity:0;
  transform:scale(0.96);
  transform-origin:center center;
  pointer-events:none;
  z-index:-1;
  transition:opacity 0.35s ease, transform 0.35s ease,
             border-color 2s ease, box-shadow 2s ease;
}
.band-info-box__visual.show{
  opacity:1;
  transform:scale(1);
  transition:opacity var(--box-dur) cubic-bezier(0.16,1,0.3,1) var(--box-delay),
             transform var(--box-dur) cubic-bezier(0.16,1,0.3,1) var(--box-delay),
             border-color 2s ease, box-shadow 2s ease;
}

.band-photo-container{display:flex;align-items:center;justify-content:center;width:100%;flex:0 0 auto;}
.band-photo-frame{position:relative;display:inline-block;line-height:0;}
/* 头像：底部渐隐（保留此效果） */
.band-photo{display:block;max-width:100%;max-height:36vh;width:auto;height:auto;border-radius:16px;transform-origin:center center;-webkit-mask-image:linear-gradient(to top, transparent 0%, rgba(0,0,0,0.35) 12%, black 30%);mask-image:linear-gradient(to top, transparent 0%, rgba(0,0,0,0.35) 12%, black 30%);opacity:0;transform:scale(0.3);transition:opacity 0.35s ease, transform 0.35s ease;}
.band-photo.show{opacity:1;transform:scale(1);transition:opacity var(--photo-dur) cubic-bezier(0.16,1,0.3,1) var(--photo-delay),transform var(--photo-dur) cubic-bezier(0.16,1,0.3,1) var(--photo-delay);}
/* 名字：贴在照片下方居中，字间距由 JS 自适应 */
.band-name{
  position:absolute;
  left:50%;
  bottom:0;
  padding:0 0 10px 0;           /* 【名字下距】名字距照片底部 */
  white-space:nowrap;
  font-family:"Orbitron","Noto Sans SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:3.2rem;              /* 【名字字号】主文字大小 */
  font-weight:900;line-height:1.15;letter-spacing:4px;
  color:var(--theme-color);      /* 【名字颜色】跟随主题色 */
  text-shadow:0 0 15px var(--theme-color),0 0 32px var(--theme-color);  /* 【名字泛光】主题色发光 */
  z-index:3;pointer-events:none;
  transform-origin:center bottom;
  opacity:0;
  transform:translateX(-50%) scale(0.5);
  filter:blur(10px);
  transition:opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease, color 2s ease, text-shadow 2s ease;
}
.band-name.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
  filter:blur(0);
  transition:opacity var(--name-dur) cubic-bezier(0.23,1,0.32,1) var(--name-delay),
             transform var(--name-dur) cubic-bezier(0.23,1,0.32,1) var(--name-delay),
             filter var(--name-dur) ease var(--name-delay),
             color 2s ease, text-shadow 2s ease;
}
/* 简介：背景 + 毛玻璃 + 圆角 + 缩放动画 */
.band-desc-container{display:inline-block;padding:16px 28px;/* 【简介内距】上/下 16px，左/右 28px */background:rgba(255,255,255,0.010);/* 【简介背景亮度】0.025，数字越大简介框越亮 */backdrop-filter:blur(7px);/* 【简介模糊】10px，数字越大越模糊 */-webkit-backdrop-filter:blur(15px);border-radius:18px;/* 【简介圆角】数字越大越圆 */max-width:95%;text-align:center;transform-origin:center center;opacity:0;transform:scale(0.8);transition:opacity 0.35s ease, transform 0.35s ease;}
.band-desc-container.show{opacity:1;transform:scale(1);transition:opacity var(--desc-dur) cubic-bezier(0.16,1,0.3,1) var(--desc-delay),transform var(--desc-dur) cubic-bezier(0.16,1,0.3,1) var(--desc-delay);}
/* 简介文字 */
.band-desc{font-size:1.35rem;/* 【简介字号】主文字大小 */line-height:1.35;color:var(--desc-color);transition:color 2s ease;}
.progress-bar-container{position:absolute;bottom:-20px;left:0;width:100%;height:3px;background:rgba(255,255,255,0.05);}
.progress-bar{height:100%;background:var(--theme-color);box-shadow:0 0 20px var(--theme-color);transition:background-color 2s ease,box-shadow 2s ease;width:0%;}
#introOverlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:1002;pointer-events:none;opacity:1;display:flex;align-items:center;justify-content:center;}
#introOverlay::after{content:"—轻触空格开始—";color:rgba(255,255,255,0.55);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:1.5rem;letter-spacing:5px;animation:pulse 4s infinite;}
#introOverlay::before{content:"按F11全屏   左右键快速翻页   空格暂停进度";position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.28);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:0.8rem;letter-spacing:4px;}
@keyframes pulse{0%{opacity:0.35;}50%{opacity:0.85;}100%{opacity:0.35;}}
#introOverlay.started::after{display:none;}
#introOverlay.started::before{display:none;}
.session-timer{position:fixed;bottom:20px;right:40px;font-family:"Orbitron",sans-serif;font-size:0.9rem;color:rgba(255,255,255,0.4);letter-spacing:2px;z-index:10;}
:fullscreen body{cursor:none;}
.mvp-bg-container{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;pointer-events:none;overflow:hidden;}
.mvp-bg-image{position:absolute;top:0;left:0;height:100vh;width:auto;max-width:none;object-fit:contain;object-position:left center;filter:brightness(0.55);-webkit-mask-image:linear-gradient(to right,rgba(0,0,0,1) 0%,rgba(0,0,0,0.85) 25%,rgba(0,0,0,0.4) 60%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(to right,rgba(0,0,0,1) 0%,rgba(0,0,0,0.85) 25%,rgba(0,0,0,0.4) 60%,rgba(0,0,0,0) 100%);transform:translateX(-100%);opacity:0;will-change:transform,opacity;transition:transform var(--bg-enter-duration,1.5s) cubic-bezier(0.16,1,0.3,1),opacity var(--bg-enter-duration,1.5s) ease;}
.mvp-bg-image.active{transform:translateX(0);opacity:1;}
.mvp-bg-image.exit{transition:transform 0.4s ease,opacity 0.4s ease;transform:translateX(-100%);opacity:0;}
</style>
</head>
<body>
<audio id="bgMusic" src="music.mp3"></audio>
<div id="bgLayerA" class="bg-layer"></div>
<div id="bgLayerB" class="bg-layer"></div>
<div id="introOverlay"></div>
<div id="mvpBgContainer" class="mvp-bg-container"></div>
<canvas id="particles-canvas"></canvas>
<div class="session-timer" id="sessionTimer">00:00:00</div>
<div class="container">
<div class="main-layout">
<div class="left-panel">
  <div id="radarGlass" class="radar-glass"></div>
  <canvas id="radarCanvas" width="1600" height="1600"></canvas>
</div>
<div class="right-panel">
<div class="band-info-box" id="bandInfoBox">
  <div class="band-info-box__visual" id="bandInfoBoxVisual"></div>
  <div class="band-photo-container" id="photoContainer">
    <div class="band-photo-frame">
      <img id="bandPhoto" class="band-photo" src="" alt="" draggable="false">
      <div class="band-name" id="bandName"></div>
    </div>
  </div>
  <div class="band-desc-container" id="descContainer"><div class="band-desc" id="bandDesc"></div></div>
</div>
<div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
</div>
</div>
</div>
<script>
// ============================================================
//  全局强制显示模式（调试用，一般保持 null 不动）
//    null = 每个选手按各自 mode 显示
//    1/2/3 = 强制全部用某个平台
// ============================================================
const FORCE_DISPLAY_MODE=null;

// ============================================================
//  第二维度的三种平台预设
//    1 = 完美平台（WE 致胜评分）
//    2 = 5E 新数据（5E SS 局势影响）
//    3 = 5E 老数据（Surviving 存活率）
// ============================================================
const MODE_PRESETS={
1:{name:"WE",base:8,usePercent:false,sub:"致胜评分"},
2:{name:"5E SS",base:6,usePercent:false,sub:"局势影响"},
3:{name:"Surviving",base:0.35,usePercent:true,sub:"存活率"}
};
const SUB_LABELS=["回合击杀","","回合伤害","回合胜利贡献","","不白给率"];

// ============================================================
//  ============ 参数调整区（改这里就够了）============
// ============================================================
const CONFIG={
// ———————— 雷达外观 ————————
RADAR_SCALE:0.78,             // 【雷达大小】雷达整体尺寸，0.5=小 1.0=大
RADAR_GRID_LEVELS:4,          // 【雷达圈数】底图同心六边形有几圈
RADAR_GRID_LINE_WIDTH:2,      // 【底图线粗】数字越大线条越粗
RADAR_GRID_LINE_OPACITY:0.2,  // 【底图透明】0~1，越大越明显
VERTEX_COUNT:6,               // 【雷达角数】有几个维度

// ———————— 维度名称与基准值 ————————
DIM_NAMES:["KPR","WE","ADR","RWS","Rating","KAST"],   // 每个角的文字
BASE_MAX_SCORES:[0.8,8,90,14,1.2,0.75],               // 每个维度的基准值（达到=顶点落在最外圈）
MIN_SCORES:[0,0,0,0,0,0],                             // 每个维度的最低值（作为雷达中心）
USE_PERCENTAGE:[false,false,false,false,false,true],  // 该维度数值是否按百分比显示

// ———————— 标签字体 ————————
LABEL_FONT_SIZE:28,           // 【标签字号】主文字（如 "KPR 1.21"）大小
SUB_FONT_RATIO:0.5,           // 【小字比例】中文小备注相对主文字的比例
SUB_GAP_Y:3,                  // 【小字间距】主文字与下方小字的垂直距离
BEST_GAP_Y:6,                 // 【徽章间距】小字与 BEST/2nd 的垂直距离
LABEL_MARGIN:80,              // 【标签外距】顶点在底图内时，标签距最外圈的距离
LABEL_FOLLOW_GAP:35,          // 【标签跟随】顶点超出底图时，标签距顶点的距离

// ———————— 时长 ————————
DEFAULT_DURATION:12000,       // 【默认停留】每个选手显示多久（毫秒），会被 namelist 里的 duration 覆盖
INTRO_WAIT_TIME:600,          // 【开场等待】按空格到黑幕消失的时间（毫秒）

// ———————— 动画时长 ————————
GRID_ANIM_DURATION:600,          // 【底图展开】六边形网格从小到大的时长（毫秒）
GRID_ANIM_DELAY_AFTER_INTRO:100, // 【底图延迟】黑幕消失后等多久开始展开（毫秒）
ANIM_DURATION:1200,              // 【数据生长】雷达多边形从中心到目标值的时长（毫秒）
DATA_DELAY_AFTER_GRID:50,        // 【数据延迟】底图展开完后等多久开始生长（毫秒）
DATA_FADE_IN_DURATION:400,       // 【数据淡入】数据多边形从透明到不透明的时长（毫秒）
BEST_FADE_IN_DURATION:600,       // 【徽章淡入】BEST/2nd 出现动画时长（毫秒）
BEST_FADE_OUT_DURATION:200,      // 【徽章淡出】BEST/2nd 消失动画时长（毫秒）

// ———————— UI 元素（名字/头像/简介/大框）————————
UI_ITEM_DURATION:850,         // 【UI 动画时长】每个 UI 元素的出现动画时长（毫秒）
UI_ITEM_GAP:125,              // 【UI 动画间隔】四个元素（名字/人像/简介/大框）依次出现的间隔（毫秒）
SCENE_FADE_DURATION:400,      // 【雷达渐隐】切换选手时整体渐隐/渐显时长（毫秒）
UI_FADE_DURATION:400,         // 【UI 渐隐】切换选手时右侧元素的渐隐时长（毫秒）

// ———————— 简介字体 ————————
DESC_MAX_FONT_REM:1.35,       // 【简介最大字号】简介文字允许的最大字号
DESC_MIN_FONT_REM:0.85,       // 【简介最小字号】自动缩字时的下限
DESC_COLOR_WHITEN:0.6,        // 【简介颜色】0=完全是主题色，1=纯白，0.6=向白混 60%

// ———————— 边界与防抖 ————————
LABEL_PAD:5,                  // 【标签边距】标签距屏幕边缘留白
EDGE_SOFT_OVER:40,            // 【软边界溢出】超过硬边界后最多再溢出多少像素
EDGE_SOFT_RANGE:250,          // 【软边界衰减】减速曲线平滑度，越大越平缓
SMOOTH_LABEL_ALPHA:0.6,       // 【标签平滑】0~1，越大越灵敏、越小越平缓

// ———————— 自适应缩放（低分辨率 / 窄屏时雷达自动缩小）————————
RADAR_MAX_WIDTH_RATIO:0.6,    // 【雷达宽占比】雷达直径上限 = 左面板宽 × 此值
RADAR_MAX_HEIGHT_RATIO:0.6,   // 【雷达高占比】雷达直径上限 = 左面板高 × 此值

// ———————— 名字宽度策略 ————————
NAME_MIN_RATIO_TWO:0.5,       // 【2 字符名字】最小宽度 = 图片宽度 × 此值（如"李处""哼畜"）
NAME_MIN_RATIO_SHORT:0.618,   // 【3 字符名字】最小宽度 = 图片宽度 × 此值（如"辱投猪"）
NAME_NEAR_RATIO:0.8,          // 【接近阈值】自然宽度 ≥ 图片宽度 × 此值 视为"接近"
NAME_NEAR_EXTRA:0.15,         // 【接近补偿】"接近"时额外加的间距比例（15%）

// ———————— 背景色（极暗版的主题色）————————
BG_DARKEN_1:0.05,             // 【背景色1】主题色 × 此系数 = 背景渐变起始色
BG_DARKEN_2:0.02,             // 【背景色2】主题色 × 此系数 = 背景渐变结束色

// ———————— 粒子 ————————
PARTICLE_OPACITY_MULT:2.0,    // 【粒子透明度】数值越大粒子越明显
PARTICLE_SIZE_MULT:2.0,       // 【粒子大小】数值越大粒子越大

// ———————— 选手专属音频 ————————
VOICE_VOLUME:0.25,            // 【音频音量】0~1
VOICE_LOOP_GAP:5000,          // 【循环间隔】播完后等多少毫秒再播
VOICE_FADE_DURATION:1000,     // 【切歌淡出】切换选手时旧音频淡出时长（毫秒）

// ———————— 其他开关 ————————
SHOW_DESC:true,                       // 【显示简介】false 时不显示右侧简介
REPLAY_GRID_ANIM_ON_EACH_BAND:true    // 【重播底图】true=每次切换选手都重播底图展开动画
};

// ============================================================
//  ============ 选手列表（在这里加/改选手）============
//  name            : 选手名（也是 ./pic/ 下的图片文件名、./mus/ 下的音频文件名）
//  points          : 六维数据 [KPR, 第二维度, ADR, RWS, Rating, KAST]
//                    第二维度按 mode 对应的平台填；KAST 填 0-1 小数（0.90 显示为 90%）
//  mode            : 第二维度用哪个平台
//                    1 = 完美平台（WE 致胜评分）
//                    2 = 5E 新数据（5E SS 局势影响）
//                    3 = 5E 老数据（Surviving 存活率）
//  desc            : 简介文字
//  color           : 该选手主题色
//  duration        : 该选手停留时长（毫秒）
//  voiceAfterGrid  : 【音频延迟开关】true = 音频等雷达底图展开完再播；不写或 false = 立刻播
// ============================================================

function scaleHexColor(hex,factor){
const r=Math.min(255,Math.round(parseInt(hex.slice(1,3),16)*factor));
const g=Math.min(255,Math.round(parseInt(hex.slice(3,5),16)*factor));
const b=Math.min(255,Math.round(parseInt(hex.slice(5,7),16)*factor));
return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function initVoiceSlots(){
if(voiceSlotA)return;
voiceSlotA=new Audio(); voiceSlotA.preload='auto'; voiceSlotA.volume=CONFIG.VOICE_VOLUME;
voiceSlotB=new Audio(); voiceSlotB.preload='auto'; voiceSlotB.volume=CONFIG.VOICE_VOLUME;
[voiceSlotA,voiceSlotB].forEach(slot=>{
slot.addEventListener('ended',()=>{
if(slot!==activeVoice)return;
if(voiceLoopTimer){clearTimeout(voiceLoopTimer);}
voiceLoopTimer=setTimeout(()=>{
voiceLoopTimer=null;
if(slot===activeVoice && slot.src){
try{
slot.currentTime=0;
slot.volume=CONFIG.VOICE_VOLUME;
slot.play().catch(()=>{});
}catch(e){}
}
},CONFIG.VOICE_LOOP_GAP);
});
});
}

// 在 user gesture 里调用：静音播放一次解锁 autoplay
// 用独立的临时 Audio 解锁，不碰正式槽（避免和 playVoiceAudio 抢同一个 slot）
function unlockVoiceSlots(){
initVoiceSlots();
[voiceSlotA,voiceSlotB].forEach(slot=>{
if(slot._unlocked)return;
try{
const temp=new Audio();
temp.muted=true;
temp.src=SILENT_SRC;
const p=temp.play();
const done=()=>{
try{temp.pause();temp.removeAttribute('src');}catch(e){}
slot._unlocked=true;
};
if(p&&p.then)p.then(done).catch(done);
else done();
}catch(e){
slot._unlocked=true;
}
});
}

// 先清掉已有的 _fadeTimer，避免同一 audio 上多个 fade interval 叠加
function startVoiceFadeOut(audio){
if(!audio)return;
if(audio._fadeTimer){clearInterval(audio._fadeTimer);audio._fadeTimer=null;}
const duration=CONFIG.VOICE_FADE_DURATION;
if(duration<=0){
try{audio.pause();}catch(e){}
return;
}
const startVol=audio.volume;
const startTime=performance.now();
const timer=setInterval(()=>{
const elapsed=performance.now()-startTime;
const t=Math.min(elapsed/duration,1);
try{audio.volume=Math.max(0,startVol*(1-t));}catch(e){}
if(t>=1){
clearInterval(timer);
audio._fadeTimer=null;
try{audio.pause();}catch(e){}
}
},16);
audio._fadeTimer=timer;
}

function playVoiceAudio(bandName){
initVoiceSlots();
if(voiceLoopTimer){clearTimeout(voiceLoopTimer);voiceLoopTimer=null;}
// 旧槽淡出
if(activeVoice){
startVoiceFadeOut(activeVoice);
}
// 切换到另一个槽
const nextSlot=(activeVoice===voiceSlotA)?voiceSlotB:voiceSlotA;
activeVoice=nextSlot;
// 清掉目标槽上可能还在跑的淡出定时器，否则它会把音量降回 0 并 pause，导致无声
if(nextSlot._fadeTimer){clearInterval(nextSlot._fadeTimer);nextSlot._fadeTimer=null;}
// 重置目标槽
try{
nextSlot.pause();
nextSlot.currentTime=0;
nextSlot.volume=CONFIG.VOICE_VOLUME;
nextSlot.removeAttribute('src');
}catch(e){}
const seq=++voiceSeq;
let idx=0;
const tryLoad=()=>{
if(idx>=VOICE_EXTS.length)return;
if(seq!==voiceSeq)return;
if(nextSlot!==activeVoice)return;
const test=new Audio();
test.preload='auto';
test.oncanplay=()=>{
if(seq!==voiceSeq)return;
if(nextSlot!==activeVoice)return;
try{
nextSlot.src=test.src;
nextSlot.volume=CONFIG.VOICE_VOLUME;
nextSlot.play().catch(e=>console.log("Voice play failed:",e));
}catch(e){}
};
test.onerror=()=>{idx++;tryLoad();};
test.src=`./mus/${bandName}.${VOICE_EXTS[idx]}`;
};
tryLoad();
}

function stopVoiceAudio(){
voiceSeq++;
if(voiceLoopTimer){clearTimeout(voiceLoopTimer);voiceLoopTimer=null;}
if(voiceDelayTimer){clearTimeout(voiceDelayTimer);voiceDelayTimer=null;}
if(activeVoice){
startVoiceFadeOut(activeVoice);
}
}

function fitDescFont(el,text){
el.textContent=text;
el.style.fontSize=CONFIG.DESC_MAX_FONT_REM+"rem";
void el.offsetWidth;
const container=el.parentElement;
const maxContainerW=container.parentElement.clientWidth*0.95;
const maxTextW=maxContainerW-80;
descProbe.textContent=text;
descProbe.style.fontSize=CONFIG.DESC_MAX_FONT_REM+"rem";
const fullW=descProbe.offsetWidth;
if(fullW<=maxTextW)return;
const lineCount=Math.ceil(fullW/maxTextW);
const lastLineW=fullW-(lineCount-1)*maxTextW;
const rootFS=parseFloat(getComputedStyle(document.documentElement).fontSize);
const fontSizePx=CONFIG.DESC_MAX_FONT_REM*rootFS;
const lastLineChars=lastLineW/fontSizePx;
if(lastLineChars<=2){
let chosen=CONFIG.DESC_MIN_FONT_REM;
for(let fs=CONFIG.DESC_MAX_FONT_REM;fs>=CONFIG.DESC_MIN_FONT_REM-0.001;fs-=0.05){
descProbe.style.fontSize=fs.toFixed(2)+"rem";
if(descProbe.offsetWidth<=maxTextW){chosen=fs;break;}
}
el.style.fontSize=chosen.toFixed(2)+"rem";
}
}

function fitNameSpacing(nameEl,imgEl,text){
const imgW=imgEl.offsetWidth;
if(!imgW)return;
nameEl.style.letterSpacing="0px";
nameEl.style.paddingLeft="0px";
void nameEl.offsetWidth;
const fontSize=parseFloat(getComputedStyle(nameEl).fontSize);
nameProbe.style.fontSize=fontSize+"px";
nameProbe.textContent=text;
const baseW=nameProbe.offsetWidth;
const n=text.length;
const baseRatio=baseW/imgW;
let targetW=baseW;
if(baseRatio>=CONFIG.NAME_NEAR_RATIO){
  targetW=baseW*(1+CONFIG.NAME_NEAR_EXTRA);
}
if(n===2){
  targetW=Math.max(targetW,imgW*CONFIG.NAME_MIN_RATIO_TWO);
}else if(n===3){
  targetW=Math.max(targetW,imgW*CONFIG.NAME_MIN_RATIO_SHORT);
}
let spacing=n>1?(targetW-baseW)/(n-1):0;
if(spacing<0)spacing=0;
nameEl.style.letterSpacing=spacing.toFixed(2)+"px";
nameEl.style.paddingLeft=spacing.toFixed(2)+"px";
}

class Particle{
constructor(type="normal"){this.type=type;this.reset(true);}
reset(init=false){
this.x=Math.random()*pCanvas.width;
this.isTop=Math.random()>0.5;
this.y=this.isTop?-100:pCanvas.height+100;
if(init)this.y=Math.random()*pCanvas.height;
if(this.type==="normal"){
this.vy=(this.isTop?1:-1)*(Math.random()*1.5+0.5);
this.vx=(Math.random()-0.5)*1;
this.size=Math.random()*2+1;
this.bloomMult=10*CONFIG.PARTICLE_SIZE_MULT;
this.alphaMult=0.9*CONFIG.PARTICLE_OPACITY_MULT;
}else{
this.vy=(this.isTop?1:-1)*(Math.random()*0.4+0.2);
this.vx=(Math.random()-0.5)*0.5;
this.size=Math.random()*5+5;
this.bloomMult=15*CONFIG.PARTICLE_SIZE_MULT;
this.alphaMult=0.25*CONFIG.PARTICLE_OPACITY_MULT;
}
}
update(){
this.x+=this.vx;this.y+=this.vy;
const dist=Math.abs(this.y-pCanvas.height/2)/(pCanvas.height/2);
this.life=dist;
if(this.life<=0.05||this.y<-150||this.y>pCanvas.height+150)this.reset();
}
draw(){
pCtx.save();
pCtx.globalAlpha=Math.max(0,this.life*this.alphaMult*particleFadeLevel);
const gradSize=this.size*this.bloomMult;
const g=pCtx.createRadialGradient(this.x,this.y,0,this.x,this.y,gradSize);
g.addColorStop(0,hexToRgbA(currentThemeColor,0.7));
g.addColorStop(0.3,hexToRgbA(currentThemeColor,0.2));
g.addColorStop(1,"transparent");
pCtx.fillStyle=g;
pCtx.beginPath();pCtx.arc(this.x,this.y,gradSize,0,Math.PI*2);pCtx.fill();
if(this.type==="normal"){pCtx.fillStyle="#fff";pCtx.beginPath();pCtx.arc(this.x,this.y,this.size,0,Math.PI*2);pCtx.fill();}
pCtx.restore();
}
}

function hexToRgbA(hex,alpha){
const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
return r?`rgba(${parseInt(r[1],16)}, ${parseInt(r[2],16)}, ${parseInt(r[3],16)}, ${alpha})`:`rgba(255,255,255,${alpha})`;
}
function lerpColor(c1,c2,t){
const r1=parseInt(c1.substring(1,3),16),g1=parseInt(c1.substring(3,5),16),b1=parseInt(c1.substring(5,7),16);
const r2=parseInt(c2.substring(1,3),16),g2=parseInt(c2.substring(3,5),16),b2=parseInt(c2.substring(5,7),16);
const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function tick(timestamp){
if(!lastTimestamp)lastTimestamp=timestamp;
const deltaTime=timestamp-lastTimestamp;
lastTimestamp=timestamp;
if(!isPaused&&globalCurrentTime<totalDuration){
globalCurrentTime+=deltaTime;
if(globalCurrentTime>=totalDuration){globalCurrentTime=totalDuration;isPaused=true;}
const seg=timeSegments.find(s=>globalCurrentTime>=s.start&&globalCurrentTime<s.end);
if(seg&&seg.bandIndex!==currentIndex){
currentIndex=seg.bandIndex;
updateUI(bands[currentIndex],false);
}
}
if(currentThemeColor!==targetThemeColor){
  // 每帧向目标色靠近，若因舍入误差导致不再变化则直接吸附到目标色（避免颜色卡死）
  const nextColor=lerpColor(currentThemeColor,targetThemeColor,0.02);
  currentThemeColor=(nextColor===currentThemeColor)?targetThemeColor:nextColor;
}
if(sceneOpacity!==sceneFadeTarget){
const sp=deltaTime/CONFIG.SCENE_FADE_DURATION;
if(sceneOpacity<sceneFadeTarget)sceneOpacity=Math.min(sceneFadeTarget,sceneOpacity+sp);
else sceneOpacity=Math.max(sceneFadeTarget,sceneOpacity-sp);
}
if(pendingGridAnimStart){
pendingGridAnimStart=false;
gridAnimStartTime=timestamp+pendingGridAnimDelay;
}
if(!gridAnimDone){
const elapsed=timestamp-gridAnimStartTime;
if(elapsed>0){
const linearT=Math.min(elapsed/CONFIG.GRID_ANIM_DURATION,1);
gridAnimProgress=1-Math.pow(1-linearT,2);
if(linearT>=1){
gridAnimProgress=1;gridAnimDone=true;
dataStartTime=timestamp+CONFIG.DATA_DELAY_AFTER_GRID;
}
}
}
if(gridAnimDone&&dataAnimPending&&!dataAnimStarted&&timestamp>=dataStartTime){
dataAnimStarted=true;dataAnimPending=false;animProgress=0;
animStartTime=timestamp;dataOpacity=0;dataFadeStartTime=timestamp;
}
if(dataAnimStarted&&dataOpacity<1){
const elapsed=timestamp-dataFadeStartTime;
dataOpacity=Math.min(1,elapsed/CONFIG.DATA_FADE_IN_DURATION);
}
if(animProgress<1){
const elapsed=timestamp-animStartTime;
let t=Math.min(elapsed/ANIM_DURATION,1);
t=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
for(let i=0;i<CONFIG.VERTEX_COUNT;i++)currentScores[i]=(1-t)*startScores[i]+t*targetScores[i];
if(t>=1)animProgress=1;
}
bestFadeTarget=(animProgress>=1)&&!dataAnimPending?1:0;
if(bestFade<bestFadeTarget){bestFade=Math.min(bestFadeTarget,bestFade+deltaTime/CONFIG.BEST_FADE_IN_DURATION);}
else if(bestFade>bestFadeTarget){bestFade=Math.max(bestFadeTarget,bestFade-deltaTime/CONFIG.BEST_FADE_OUT_DURATION);}
for(let i=0;i<CONFIG.VERTEX_COUNT;i++){
const tl=(i===activeHighlightDim)?1:0;
dimHighlightLevels[i]+=(tl-dimHighlightLevels[i])*Math.min(deltaTime*0.01,1);
}
const targetFade=isParticlesEnabled?1:0;
if(particleFadeLevel!==targetFade){
const fs=deltaTime/1000;
if(particleFadeLevel<targetFade)particleFadeLevel=Math.min(1,particleFadeLevel+fs);
else particleFadeLevel=Math.max(0,particleFadeLevel-fs);
}
if(particleFadeLevel>0){
pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
particles.forEach(p=>{p.update();p.draw();});
}else{
pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
}
drawRadar();
updateTimer();
requestAnimationFrame(tick);
}

// ★ 确保中文字体在 canvas 首次绘制前就绪
//   canvas 的 ctx.font 会用列表里第一个能渲染该字符的字体，
//   如果 Noto Sans SC 尚未加载完，中文会 fallback 到系统默认 sans-serif。
//   所以在启动 tick 之前显式等待字体加载完成。
window.onload=async function(){
// 等待 @font-face 全部就绪
try{
if(document.fonts&&document.fonts.ready){await document.fonts.ready;}
if(document.fonts&&document.fonts.load){
// 主动预热会用到的字体变体（Orbitron 英文/数字 + Noto Sans SC 中文）
await Promise.all([
document.fonts.load('500 28px Orbitron').catch(()=>{}),
document.fonts.load('700 28px Orbitron').catch(()=>{}),
document.fonts.load('900 28px Orbitron').catch(()=>{}),
document.fonts.load('400 28px "Noto Sans SC"').catch(()=>{}),
document.fonts.load('500 28px "Noto Sans SC"').catch(()=>{}),
document.fonts.load('700 28px "Noto Sans SC"').catch(()=>{}),
document.fonts.load('900 28px "Noto Sans SC"').catch(()=>{})
]);
}
}catch(e){console.log('Font preload failed:',e);}

requestAnimationFrame(tick);
alignSessionTimer();
layoutRadar();
window.addEventListener('dragover',(e)=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
window.addEventListener('drop',(e)=>{
e.preventDefault();
const files=e.dataTransfer.files;
if(files.length>0&&currentIndex>=0){
const file=files[0];
if(file.type.startsWith('image/')){
const cbn=bands[currentIndex].name;
const ext=file.name.split('.').pop();
const reader=new FileReader();
reader.onload=(ev)=>{
const link=document.createElement('a');
link.href=ev.target.result;
link.download=`${cbn}.${ext}`;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
};
reader.readAsDataURL(file);
}
}
});
};
</script>
